<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기억의 복원가</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e8f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        .memory { font-style: italic; color: #555; margin: 20px 0; line-height: 1.5; background: #f7f9fa; padding: 15px; border-radius: 8px; }
        button { background: #2980b9; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background: #1f618d; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🖼️ 기억의 복원가</h2>
        <div class="memory" id="memo">"1987년 여름, 우리는 그 바닷가 작은 민박집 앞 ____에 앉아 있었다."</div>
        <p>빈칸에 들어갈 가장 알맞은 단서를 고르세요.</p>
        <div id="options">
            <button onclick="selectAnswer(1)">낡은 나무 평상</button>
            <button onclick="selectAnswer(2)">최신형 스포츠카</button>
            <button onclick="selectAnswer(3)">우주선 조종석</button>
        </div>
    </div>
    <script>
        function selectAnswer(num) {
            const memo = document.getElementById('memo');
            const options = document.getElementById('options');
            if(num === 1) {
                memo.textContent = "기억이 선명해집니다: '낡은 나무 평상에 앉아 파도 소리를 들었다.' (치유율 100%)";
                options.innerHTML = "<button onclick='location.reload()'>처음부터 다시</button>";
            } else {
                memo.textContent = "할아버지의 표정이 더 흐려집니다. 잘못된 기억입니다.";
            }
        }
    </script>
</body>
</html>
