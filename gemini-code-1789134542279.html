<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가십 전파자</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff5f5; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        .msg { background: #ffe3e3; padding: 15px; border-radius: 8px; margin: 20px 0; font-size: 1.1rem; color: #c92a2a; }
        button { background: #ff6b6b; color: white; border: none; padding: 12px 20px; margin: 5px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; }
        button:hover { background: #fa5252; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📢 가십 전파자</h2>
        <p>목표: 소문을 가장 자극적으로 부풀려 타인의 평판을 무너뜨리세요!</p>
        <div class="msg" id="gossip">원문: "팀장이 오늘 회의 시간에 커피를 쏟았다."</div>
        <div id="controls">
            <button onclick="distort(1)">"팀장이 회사 자금으로 커피 파티를 열었다"로 과장하기</button>
            <button onclick="distort(2)">"팀장이 은밀한 스파이다"로 루머 날조하기</button>
        </div>
    </div>
    <script>
        let stage = 1;
        function distort(type) {
            const g = document.getElementById('gossip');
            const c = document.getElementById('controls');
            if(stage === 1) {
                g.textContent = type === 1 ? "왜곡됨: 팀장의 수상한 자금 유용 정황 포착!" : "왜곡됨: 팀장 실종 사건의 전말!";
                c.innerHTML = `<button onclick="distort(1)">더 자극적인 단어('횡령', '비밀 조직') 조합하기</button>`;
                stage = 2;
            } else {
                g.textContent = "최종 결과: 전사 임직원이 팀장을 사기꾼으로 확신함! (미션 성공)";
                c.innerHTML = `<button onclick="location.reload()">다시 시작</button>`;
            }
        }
    </script>
</body>
</html>
